[project]
name = "patternsnap-backend"
version = "0.1.0"
description = "PatternSnap backend — pattern generation and AI analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",
    "anthropic==0.28.0",
    "svgwrite==1.4.3",
    "reportlab==4.2.2",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",
    "Pillow==10.3.0",
    "httpx==0.27.0",
    "sqlalchemy==2.0.41",
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
